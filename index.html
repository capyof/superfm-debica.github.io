<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SuperFM Dębica</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&family=Press+Start+2P&family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="icon" type="image/png" href="favicon.png">
    
    <style>
        /* --- RESET I GŁÓWNE STYLE PRZEŁĄCZNIKA --- */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            transition: background 0.3s ease, border-color 0.3s ease, box-shadow 0.3s ease;
        }

        body {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 20px;
            overflow-x: hidden;
        }

        /* Pasek wyboru motywu na górze ekranu */
        .theme-selector {
            display: flex;
            gap: 10px;
            margin-bottom: 40px;
            z-index: 10;
            background: rgba(0,0,0,0.4);
            padding: 8px;
            border-radius: 30px;
            border: 1px solid rgba(255,255,255,0.1);
        }

        .theme-btn {
            padding: 10px 20px;
            border: none;
            border-radius: 20px;
            cursor: pointer;
            font-family: 'Inter', sans-serif;
            font-size: 0.85rem;
            font-weight: 600;
            background: transparent;
            color: #ccc;
            transition: all 0.2s;
        }

        .theme-btn.active {
            background: #fff;
            color: #000;
        }

        /* --- BAZOWA KARTA ODTWARZACZA --- */
        .player-card {
            width: 100%;
            max-width: 400px;
            text-align: center;
        }

        .cover-wrapper {
            margin: 0 auto 25px auto;
            display: flex;
            justify-content: center;
            align-items: center;
            max-width: 100%; /* Zapobiega wychodzeniu poza kartę */
        }

        .cover-art {
            max-width: 100%;
            height: auto;
            display: block;
        }

        .play-btn {
            border: none;
            cursor: pointer;
            display: inline-flex;
            justify-content: center;
            align-items: center;
        }

        .visualizer-container {
            width: 100%;
            overflow: hidden;
        }

        #visualizer {
            width: 100%;
            height: 100%;
            display: block;
        }

        /* Nowe miejsce na nazwę stacji */
        .station-footer {
            width: 100%;
            text-transform: uppercase;
        }


        /* ==========================================================================
           1. STYL: NOWOCZESNY MINIMALIZM (theme-modern)
           ========================================================================== */
        body.theme-modern {
            background: radial-gradient(circle at top right, #1a1c24, #08090c);
            font-family: 'Inter', sans-serif;
        }
        .theme-modern .player-card {
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 24px;
            padding: 35px 35px 25px 35px;
            box-shadow: 0 30px 60px rgba(0, 0, 0, 0.4);
        }
        /* Zamiast sztywnego kwadratu 200x200 robimy elastyczny kontener */
        .theme-modern .cover-wrapper { 
            width: 100%; 
            max-width: 280px; /* Maksymalna szerokość logo wewnątrz karty */
            height: auto; 
            margin: 0 auto 25px auto;
        }

/* Sprawiamy, że grafika dopasowuje się idealnie i nie rozciąga pionowo */
        .theme-modern .cover-art { 
            width: 100%;
            height: auto;
            border-radius: 12px; 
            object-fit: contain; /* Gwarantuje zachowanie właściwych proporcji logo */
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.4); 
        }
        .theme-modern .track-title { font-size: 1.2rem; font-weight: 700; color: #fff; margin-bottom: 6px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .theme-modern .track-artist { font-size: 0.95rem; color: #00f2fe; font-weight: 500; margin-bottom: 30px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .theme-modern .play-btn { background: #fff; width: 64px; height: 64px; border-radius: 50%; margin-bottom: 30px; box-shadow: 0 8px 20px rgba(255, 255, 255, 0.15); }
        .theme-modern .play-btn svg { width: 24px; height: 24px; fill: #08090c; }
        .theme-modern .visualizer-container { height: 60px; background: rgba(0, 0, 0, 0.15); border-radius: 12px; margin-bottom: 25px; }
        /* Stopka modern */
        .theme-modern .station-footer { font-size: 0.75rem; font-weight: 600; color: rgba(255, 255, 255, 0.3); border-top: 1px solid rgba(255, 255, 255, 0.06); padding-top: 20px; letter-spacing: 2px; }


        /* ==========================================================================
           2. STYL: RETRO SYNTHWAVE (theme-retro)
           ========================================================================== */
        body.theme-retro {
            background-color: #0b0514;
            background-image: linear-gradient(rgba(255, 0, 128, 0.05) 1px, transparent 1px), linear-gradient(90deg, rgba(255, 0, 128, 0.05) 1px, transparent 1px);
            background-size: 40px 40px;
            font-family: 'Orbitron', sans-serif;
        }
        .theme-retro .player-card {
            background: #120924;
            border: 3px solid #ff007f;
            border-radius: 4px;
            padding: 30px;
            box-shadow: 0 0 25px rgba(255, 0, 127, 0.4);
        }
        .theme-retro .cover-wrapper { width: 100%; max-width: 240px; border: 2px solid #00f2fe; padding: 4px; background: #000; }
        .theme-retro .track-title { font-size: 1.1rem; color: #00f2fe; text-shadow: 0 0 8px rgba(0, 242, 254, 0.6); margin-bottom: 6px; text-transform: uppercase; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .theme-retro .track-artist { font-size: 0.85rem; color: #ff007f; text-shadow: 0 0 8px rgba(255, 0, 127, 0.6); margin-bottom: 25px; text-transform: uppercase; letter-spacing: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .theme-retro .play-btn { background: transparent; border: 2px solid #ff007f; color: #ff007f; font-family: 'Orbitron', sans-serif; font-size: 0.9rem; font-weight: 700; padding: 12px 30px; text-transform: uppercase; margin-bottom: 25px; }
        .theme-retro .play-btn:hover { background: #ff007f; color: #120924; }
        .theme-retro .visualizer-container { height: 70px; background: #000; border: 2px solid #331a54; padding: 8px; margin-bottom: 25px; }
        /* Stopka retro */
        .theme-retro .station-footer { font-size: 0.8rem; font-weight: 900; color: #9b51e0; text-shadow: 0 0 5px rgba(155, 81, 224, 0.6); border-top: 2px dashed #331a54; padding-top: 20px; letter-spacing: 3px; }


        /* ==========================================================================
           3. STYL: 8-BIT PIXEL ART (theme-pixel)
           ========================================================================== */
        body.theme-pixel {
            background-color: #181425;
            background-image: linear-gradient(45deg, #26213a 25%, transparent 25%, transparent 75%, #26213a 75%, #26213a), linear-gradient(45deg, #26213a 25%, #181425 25%, #181425 75%, #26213a 75%, #26213a);
            background-size: 16px 16px;
            background-position: 0 0, 8px 8px;
            font-family: 'Press Start 2P', monospace;
            image-rendering: pixelated;
        }
        .theme-pixel .player-card {
            background: #2c2c2c;
            border: 4px solid #000;
            box-shadow: inset -4px -4px 0px #1a1a1a, inset 4px 4px 0px #4a4a4a, 8px 8px 0px rgba(0, 0, 0, 0.4);
            padding: 24px;
            max-width: 360px;
        }
        .theme-pixel .cover-wrapper { width: 160px; height: 120px; background: #111; border: 4px solid #000; box-shadow: inset -4px -4px 0px #333, inset 4px 4px 0px #000; padding: 8px; }
        .theme-pixel .track-title { font-size: 8px; color: #ffca51; margin-bottom: 8px; text-transform: uppercase; line-height: 1.4; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .theme-pixel .track-artist { font-size: 7px; color: #ff3e3e; margin-bottom: 24px; text-transform: uppercase; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .theme-pixel .play-btn { font-family: 'Press Start 2P', monospace; font-size: 9px; background: #5ac54f; color: #fff; border: 4px solid #000; box-shadow: inset -4px -4px 0px #368628, inset 4px 4px 0px #86e07b; padding: 12px 24px; text-transform: uppercase; margin-bottom: 24px; }
        .theme-pixel .play-btn:active { box-shadow: inset 4px 4px 0px #368628, inset -4px -4px 0px #86e07b; }
        .theme-pixel .visualizer-container { height: 48px; background: #000; border: 4px solid #000; padding: 4px; margin-bottom: 20px; }
        /* Stopka pixel */
        .theme-pixel .station-footer { font-size: 7px; color: #fff; background: #000; border: 4px solid #000; box-shadow: inset -4px -4px 0px #222; padding: 10px 4px; line-height: 1; }
    </style>
</head>

<body class="theme-modern">

    <div class="theme-selector">
        <button class="theme-btn active" onclick="setTheme('modern')">Modern</button>
        <button class="theme-btn" onclick="setTheme('retro')">Retro</button>
        <button class="theme-btn" onclick="setTheme('pixel')">8-Bit</button>
    </div>

    <div class="player-card">
        <div class="cover-wrapper">
            <img src="https://images.unsplash.com/photo-1614613535308-eb5fbd3d2c17?w=500&auto=format&fit=crop&q=60">
        </div>

        <div class="track-title" id="title">Ładowanie...</div>
        <div class="track-artist" id="artist">Proszę czekać</div>

        <div class="controls">
            <button class="play-btn" id="playButton">
                <span id="btnContent"><svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg></span>
            </button>
        </div>

        <div class="visualizer-container">
            <canvas id="visualizer"></canvas>
        </div>

        <div class="station-footer" id="stationName">SuperFM Dębica</div>
    </div>

    <script>
        // ==========================================
        //  KONFIGURACJA STRUMIENIA, API I NAZWY
        // ==========================================
        const STREAM_URL = "https://superfm-debica.loophole.site/listen/superfm-debica/radio.mp3"; 
        const API_URL = "https://superfm-debica.loophole.site/api/nowplaying/1"; 
        
        // WPISZ TUTAJ NAZWĘ SWOJEJ STACJI (np. "Retro FM", "Pixel Radio" itp.)
        const STATION_NAME = "SuperFM Dębica"; 

        let currentTheme = 'modern';
        const playButton = document.getElementById('playButton');
        const btnContent = document.getElementById('btnContent');
        const canvas = document.getElementById('visualizer');
        const ctx = canvas.getContext('2d');

        const trackTitle = document.getElementById('title');
        const trackArtist = document.getElementById('artist');
        const trackCover = document.getElementById('cover');
        const stationFooter = document.getElementById('stationName');

        // Załadowanie nazwy stacji do stopki od razu po otwarciu strony
        stationFooter.innerText = STATION_NAME;

        const DEFAULT_COVER = "3015.png";

        let audio, audioCtx, analyser, source, bufferLength, dataArray;
        let isPlaying = false;
        let isInitialized = false;

        // --- FUNKCJA POBIERANIA TYTUŁÓW LIVE (API) ---
        function updateMetadata() {
            fetch(API_URL)
                .then(response => response.json())
                .then(data => {
                    if (data && data.now_playing && data.now_playing.song) {
                        const song = data.now_playing.song;
                        trackTitle.innerText = song.title || "Live Stream";
                        trackArtist.innerText = song.artist || "ON AIR";
                        if (song.art) {
                            trackCover.src = song.art;
                        } else {
                            trackCover.src = DEFAULT_COVER;
                        }
                    }
                })
                .catch(err => {
                    console.error("Błąd API AzuraCast:", err);
                    trackTitle.innerText = "Live Stream";
                    trackArtist.innerText = "ON AIR";
                });
        }

        updateMetadata();
        setInterval(updateMetadata, 10000);

        // --- OBSŁUGA MOTYWÓW ---
        function setTheme(themeName) {
            currentTheme = themeName;
            document.body.className = '';
            document.body.classList.add('theme-' + themeName);

            document.querySelectorAll('.theme-btn').forEach(btn => {
                btn.classList.remove('active');
                if(btn.innerText.toLowerCase().includes(themeName === 'pixel' ? '8-bit' : themeName)) {
                    btn.classList.add('active');
                }
            });
            updateButtonUI();
        }

        function updateButtonUI() {
            if (currentTheme === 'modern') {
                btnContent.innerHTML = isPlaying 
                    ? `<svg viewBox="0 0 24 24"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg>`
                    : `<svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>`;
            } else if (currentTheme === 'retro') {
                playButton.style.background = '';
                btnContent.innerHTML = isPlaying ? "STOP TAPE" : "START TAPE";
            } else if (currentTheme === 'pixel') {
                btnContent.innerHTML = isPlaying ? "PAUSE" : "START";
                playButton.style.background = isPlaying ? "#ff3e3e" : "#5ac54f";
            }
        }

        function initAudio() {
            audio = new Audio();
            audio.src = STREAM_URL;
            audio.crossOrigin = "anonymous";

            audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            analyser = audioCtx.createAnalyser();
            
            source = audioCtx.createMediaElementSource(audio);
            source.connect(analyser);
            analyser.connect(audioCtx.destination);

            isInitialized = true;
        }

        // --- PĘTLA RYSOWANIA WIZUALIZERA ---
        function draw() {
            if (!isPlaying) return;
            requestAnimationFrame(draw);

            canvas.width = canvas.clientWidth;
            canvas.height = canvas.clientHeight;

            analyser.fftSize = (currentTheme === 'pixel') ? 32 : 64;
            bufferLength = analyser.frequencyBinCount;
            if(!dataArray || dataArray.length !== bufferLength) {
                dataArray = new Uint8Array(bufferLength);
            }

            analyser.getByteFrequencyData(dataArray);
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            const barWidth = canvas.width / bufferLength;
            let x = 0;

            for (let i = 0; i < bufferLength; i++) {
                let rawHeight = dataArray[i];

                if (currentTheme === 'modern') {
                    let barHeight = rawHeight * 0.22;
                    ctx.fillStyle = `rgba(0, 242, 254, ${barHeight / canvas.height + 0.3})`;
                    ctx.beginPath();
                    if (typeof ctx.roundRect === "function") {
                        ctx.roundRect(x, canvas.height - barHeight, barWidth * 1.2 - 3, barHeight, [3, 3, 0, 0]);
                        ctx.fill();
                    } else {
                        ctx.fillRect(x, canvas.height - barHeight, barWidth * 1.2 - 3, barHeight);
                    }
                    x += barWidth * 1.2;

                } else if (currentTheme === 'retro') {
                    let barHeight = rawHeight * 0.25;
                    const segH = 4, segGap = 2;
                    const totalSegments = Math.floor(barHeight / (segH + segGap));

                    for (let j = 0; j < totalSegments; j++) {
                        const yPos = canvas.height - (j * (segH + segGap));
                        if (j < 5) ctx.fillStyle = "#39ff14";
                        else if (j < 9) ctx.fillStyle = "#ffff00";
                        else ctx.fillStyle = "#ff0033";
                        ctx.fillRect(x, yPos - segH, barWidth * 1.1 - 3, segH);
                    }
                    x += barWidth * 1.1;

                } else if (currentTheme === 'pixel') {
                    let barHeight = Math.floor((rawHeight * 0.2) / 4) * 4;
                    ctx.fillStyle = "#00ccff";
                    ctx.fillRect(x, canvas.height - barHeight, barWidth - 4, barHeight);
                    x += barWidth;
                }
            }
        }

        playButton.addEventListener('click', function() {
            if (!isInitialized) {
                initAudio();
            }

            if (!isPlaying) {
                audio.play().then(() => {
                    isPlaying = true;
                    updateButtonUI();
                    draw();
                }).catch(err => console.error("Błąd odtwarzania:", err));
            } else {
                audio.pause();
                audio.src = STREAM_URL; 
                isPlaying = false;
                updateButtonUI();
            }
        });
    </script>
</body>
</html>
